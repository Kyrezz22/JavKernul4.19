name: Build JavKernul

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git clang llvm lld build-essential libncurses-dev libssl-dev bc flex bison rsync kmod cpio python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler

      - name: Setup Environment & DTC Overlay
        run: |
          mkdir -p scripts/dtc
          cp $(which dtc) scripts/dtc/dtc_overlay
          chmod +x scripts/dtc/dtc_overlay

      - name: Configure Defconfig
        run: |
          make O=out ARCH=arm64 rosemary_defconfig

      - name: Compile Device Tree
        run: |
          make O=out ARCH=arm64 dtbs

      - name: Compile JavKernul
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=/usr/bin/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_BUILD_USER="@Java_nih_deks" \
            KBUILD_BUILD_HOST="GitHub-Actions"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavKernul
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
